name: DIY-AI Bootstrap Once

on:
  push:
    branches: [diy-ai]
    paths: [.github/workflows/diy-ai-bootstrap-once.yml]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: diy-ai
    steps:
      - uses: actions/checkout@v4
      - name: Install password bootstrap client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Refresh isolated server services
        env:
          SSH_HOST: ${{ secrets.DIY_AI_SSH_HOST }}
          SSH_PORT: ${{ secrets.DIY_AI_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DIY_AI_SSH_KNOWN_HOSTS }}
          SSHPASS: ${{ secrets.DIY_AI_BOOTSTRAP_ROOT_PASSWORD }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          remote_dir="/tmp/diy-ai-bootstrap-${GITHUB_SHA}"
          sshpass -e ssh -o ConnectTimeout=30 -p "$SSH_PORT" root@"$SSH_HOST" "install -d -m 0700 '$remote_dir'"
          sshpass -e scp -o ConnectTimeout=30 -P "$SSH_PORT" deploy/diy-ai/* root@"$SSH_HOST:$remote_dir/"
          sshpass -e ssh -o ConnectTimeout=30 -p "$SSH_PORT" root@"$SSH_HOST" \
            "iptables -F CODEX_SSH_GUARD; \
             iptables -A CODEX_SSH_GUARD -m conntrack --ctstate NEW -m recent --update --seconds 60 --hitcount 30 --name CODEX_SSH --rsource -j DROP; \
             iptables -A CODEX_SSH_GUARD -m conntrack --ctstate NEW -m recent --set --name CODEX_SSH --rsource; \
             iptables -A CODEX_SSH_GUARD -j RETURN; \
             if command -v netfilter-persistent >/dev/null; then netfilter-persistent save; \
             else install -d -m 0755 /etc/iptables && iptables-save >/etc/iptables/rules.v4; fi; \
             cd '$remote_dir' && bash bootstrap-server.sh; \
             echo ---SSH-GUARD---; iptables -S CODEX_SSH_GUARD; \
             echo ---MONGO-STATUS---; systemctl --no-pager --full status mongod-diy-ai.service || true; \
             echo ---MONGO-JOURNAL---; journalctl -u mongod-diy-ai.service --no-pager -n 40 || true"
