name: Build Client for Computer

on:
  push:
    paths:
      - "src/Cynthia.Card.Unity/**"
      - "src/Cynthia.Card/src/Cynthia.Card.Common/**"
      - ".github/workflows/unity-build-desktop.yml"
  pull_request:
    paths:
      - "src/Cynthia.Card.Unity/**"
      - "src/Cynthia.Card/src/Cynthia.Card.Common/**"
      - ".github/workflows/unity-build-desktop.yml"
  workflow_dispatch:

concurrency:
  group: unity-desktop-${{ github.ref }}
  cancel-in-progress: true


env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          - StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          - StandaloneLinux64 # Build a Linux 64-bit standalone.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/cache@v4
        with:
          path: src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build shared Unity model
        run: dotnet build src/Cynthia.Card/src/Cynthia.Card.Common/Cynthia.Card.Common.csproj
      - name: Sync Cynthia.Card.Common.dll
        run: cp src/Cynthia.Card/src/Cynthia.Card.Common/bin/Debug/netstandard2.0/Cynthia.Card.Common.dll src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Assemblies/Cynthia.Card.Common.dll
      - name: Read Unity client version
        id: client_version
        shell: bash
        run: |
          set -Eeuo pipefail
          settings="src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/ProjectSettings/ProjectSettings.asset"
          client_version="$(sed -n 's/^[[:space:]]*bundleVersion:[[:space:]]*//p' "$settings" | head -n 1 | tr -d '\r')"
          [[ "$client_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$client_version" >> "$GITHUB_OUTPUT"
      - uses: game-ci/unity-builder@4c4611c0210278e7f182a06c92786b307158806b
        id: unity_build
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: src/Cynthia.Card.Unity/src/Cynthia.Unity.Card
          buildName: DiyGwent-AITest-${{ matrix.targetPlatform }}
          versioning: Custom
          version: ${{ steps.client_version.outputs.value }}
          allowDirtyBuild: true
      - name: Package desktop client
        id: package
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.targetPlatform }}
          EXPECTED_CLIENT_VERSION: ${{ steps.client_version.outputs.value }}
        run: |
          set -Eeuo pipefail
          version_file="build/$TARGET_PLATFORM/version.txt"
          test -s "$version_file"
          client_version="$(tr -d '\r\n' < "$version_file")"
          [[ "$client_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$client_version" = "$EXPECTED_CLIENT_VERSION"
          case "$TARGET_PLATFORM" in
            StandaloneWindows64) archive_name="DiyGwent-AITest-Windows-$client_version.zip" ;;
            StandaloneOSX) archive_name="DiyGwent-AITest-macOS-$client_version.zip" ;;
            StandaloneLinux64) archive_name="DiyGwent-AITest-Linux-$client_version.zip" ;;
            *) echo "Unsupported desktop target: $TARGET_PLATFORM" >&2; exit 1 ;;
          esac
          package_root="${archive_name%.zip}"
          archive_path="$GITHUB_WORKSPACE/$archive_name"
          staging_dir="$RUNNER_TEMP/package-$TARGET_PLATFORM"
          smoke_dir="$RUNNER_TEMP/smoke-$TARGET_PLATFORM"
          mkdir -p "$staging_dir/$package_root"
          cp -a --no-preserve=ownership "build/$TARGET_PLATFORM/." "$staging_dir/$package_root/"
          (
            cd "$staging_dir"
            zip -qry -y "$archive_path" "$package_root"
          )
          test -s "$archive_path"
          unzip -q "$archive_path" -d "$smoke_dir"
          case "$TARGET_PLATFORM" in
            StandaloneWindows64)
              find "$smoke_dir/$package_root" -maxdepth 1 -type f -iname '*.exe' -print -quit | grep -q .
              ;;
            StandaloneOSX)
              find "$smoke_dir/$package_root" -maxdepth 1 -type d -name '*.app' -print -quit | grep -q .
              test -n "$(find "$smoke_dir/$package_root" -type f -executable -print -quit)"
              ;;
            StandaloneLinux64)
              find "$smoke_dir/$package_root" -maxdepth 1 -type f -executable -print -quit | grep -q .
              ;;
          esac
          if [[ "$TARGET_PLATFORM" != StandaloneWindows64 ]]; then
            diff -u \
              <(find "$staging_dir/$package_root" -type f -executable -printf '%P\n' | sort) \
              <(find "$smoke_dir/$package_root" -type f -executable -printf '%P\n' | sort)
            diff -u \
              <(find "$staging_dir/$package_root" -type l -printf '%P -> %l\n' | sort) \
              <(find "$smoke_dir/$package_root" -type l -printf '%P -> %l\n' | sort)
          fi
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
          compression-level: 0
