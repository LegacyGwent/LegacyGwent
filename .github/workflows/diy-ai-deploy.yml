name: DIY-AI Deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diy-ai-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: diy-ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build self-contained Linux publish artifact
        run: |
          mkdir -p publish
          dotnet publish \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output publish \
            src/Cynthia.Card/src/Cynthia.Card.Server/Cynthia.Card.Server.csproj
          test -x publish/Cynthia.Card.Server
          test -f publish/Cynthia.Card.Server.dll
          tar -C publish -czf "gwent-diy-ai-${GITHUB_SHA}.tar.gz" .

      - name: Configure deploy key
        env:
          SSH_HOST: ${{ secrets.DIY_AI_SSH_HOST }}
          SSH_PORT: ${{ secrets.DIY_AI_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.DIY_AI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DIY_AI_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          SSH_PORT="${SSH_PORT:-22}"
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" >~/.ssh/diy-ai
          chmod 0600 ~/.ssh/diy-ai
          printf '%s\n' "$SSH_KNOWN_HOSTS" >~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          SSH_HOST: ${{ secrets.DIY_AI_SSH_HOST }}
          SSH_PORT: ${{ secrets.DIY_AI_SSH_PORT }}
          SSH_USER: ${{ secrets.DIY_AI_SSH_USER }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          archive="gwent-diy-ai-${GITHUB_SHA}.tar.gz"
          remote_archive="/var/lib/card-deploy/uploads/$archive"
          scp -o ConnectTimeout=30 -i ~/.ssh/diy-ai -P "$SSH_PORT" "$archive" "$SSH_USER@$SSH_HOST:$remote_archive"
          ssh -o ConnectTimeout=30 -i ~/.ssh/diy-ai -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo /usr/local/sbin/deploy-card-diy-ai '$GITHUB_SHA' '$remote_archive'"

      - name: Verify deployed endpoint on target host
        env:
          SSH_HOST: ${{ secrets.DIY_AI_SSH_HOST }}
          SSH_PORT: ${{ secrets.DIY_AI_SSH_PORT }}
          SSH_USER: ${{ secrets.DIY_AI_SSH_USER }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          ssh -o ConnectTimeout=30 -i ~/.ssh/diy-ai -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "curl --fail --show-error --retry 5 --retry-delay 2 http://127.0.0.1:5010/healthz"
