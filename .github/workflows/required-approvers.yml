name: Check Approvers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted]

# minimal read permissions (we only read reviews)
permissions:
  pull-requests: read

jobs:
  check-approvers:
    runs-on: ubuntu-latest
    steps:
      - name: Get approvals
        run: |
          set -euo pipefail
          # store lowercased unique approver logins as JSON array (can be empty array)
          USERS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | map(ascii_downcase)')
          echo "APPROVED_USERS=$USERS" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce approval rules
        run: |
          set -euo pipefail

          # ---- configuration ----
          REQUIRED_ANY=("The-last-Iris" "Pippow" "kajtek14102")  # require ANY of these for every path
          # -----------------------

          # runtime values (lowercased)
          PR_AUTHOR=$(jq -r '.pull_request.user.login | ascii_downcase' "$GITHUB_EVENT_PATH")
          APPROVERS=$(echo "${APPROVED_USERS:-[]}" | jq -r '.[]' 2>/dev/null || true)

          # helper: is_approved <login_lowercase>
          is_approved() {
            local login_lc="$1"
            if [ -z "$APPROVERS" ]; then
              return 1
            fi
            # match whole line (exact match)
            echo "$APPROVERS" | grep -x -i -q "$login_lc"
          }

          # require ANY of REQUIRED_ANY for every path; author counts
          ANY_OK=0
          for u in "${REQUIRED_ANY[@]}"; do
            u_lc=$(echo "$u" | tr '[:upper:]' '[:lower:]')
            if [ "$u_lc" = "$PR_AUTHOR" ]; then
              ANY_OK=1
              break
            fi
            if is_approved "$u_lc"; then
              ANY_OK=1
              break
            fi
          done

          if [ "$ANY_OK" -eq 0 ]; then
            echo "❌ Missing approval: one of ${REQUIRED_ANY[*]} must approve"
            exit 1
          fi

          echo "✅ Approval rules passed — merge allowed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
