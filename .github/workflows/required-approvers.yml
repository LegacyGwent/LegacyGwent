name: Check Approvers

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, review_requested, review_request_removed]

jobs:
  check-approvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files
        run: |
          FILES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            --paginate --jq '.[].filename' | jq -R -s -c 'split("\n")[:-1]')
          echo "CHANGED_FILES=$FILES" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get approvals
        run: |
          USERS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | map(ascii_downcase)')
          echo "APPROVED_USERS=$USERS" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce approval rules
        run: |
          SPECIAL_PATH="src/Cynthia.Card/src/Cynthia.Card.Common/CardEffects"
          REQUIRED_BOTH=("The-last-Iris" "Pippow")
          REQUIRED_ANY=("The-last-Iris" "Pippow" "kajtek14102")

          PR_AUTHOR=$(jq -r '.pull_request.user.login | ascii_downcase' "$GITHUB_EVENT_PATH")
          APPROVERS=$(echo "$APPROVED_USERS" | jq -r '.[]')

          NEED_SPECIAL=0
          for f in $(echo "$CHANGED_FILES" | jq -r '.[]'); do
            [[ "$f" == $SPECIAL_PATH* ]] && NEED_SPECIAL=1
          done

          if [ "$NEED_SPECIAL" -eq 1 ]; then
            MISSING=()
            for u in "${REQUIRED_BOTH[@]}"; do
              if [ "$u" != "$PR_AUTHOR" ] && ! echo "$APPROVERS" | grep -qi "$u"; then
                MISSING+=("$u")
              fi
            done
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "❌ Missing approvals from required users for SPECIAL_PATH: ${MISSING[*]}"
              exit 1
            fi
          else
            ANY_APPROVED=0
            for u in "${REQUIRED_ANY[@]}"; do
              if [ "$u" != "$PR_AUTHOR" ] && echo "$APPROVERS" | grep -qi "$u"; then
                ANY_APPROVED=1
                break
              fi
            done
            if [ "$ANY_APPROVED" -eq 0 ]; then
              echo "❌ Missing approval from any of the required users: ${REQUIRED_ANY[*]}"
              exit 1
            fi
          fi

          echo "✅ Approval rules passed — merge allowed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
