name: DIY-AI CI

on:
  push:
    branches: [diy-ai]
  pull_request:
    branches: [diy-ai]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diy-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate repository patches
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) git diff --check "$BEFORE_SHA" "$GITHUB_SHA" ;;
            pull_request) git diff --check "$PR_BASE_SHA" "$GITHUB_SHA" ;;
            *) git diff --check HEAD^ HEAD ;;
          esac

      - name: Validate deployment scripts
        run: bash -n deploy/diy-ai/bootstrap-server.sh deploy/diy-ai/deploy.sh deploy/diy-ai/prepare-net10-host.sh deploy/diy-ai/run-server.sh deploy/diy-ai/sync-from-diy.sh

      - name: Build server and server-side test tools
        run: dotnet build --configuration Release src/Cynthia.Card/Cynthia.Card.sln

      - name: Run server compatibility tests
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --no-restore
          src/Cynthia.Card/test/Cynthia.Card.Server.Tests/Cynthia.Card.Server.Tests.csproj

      - name: Reject known vulnerable packages
        run: |
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          dotnet list src/Cynthia.Card/Cynthia.Card.sln package \
            --vulnerable \
            --include-transitive \
            --no-restore \
            --format json > "$report"
          python scripts/check-vulnerable-packages.py "$report"

      - name: Validate self-contained Linux publish
        run: |
          dotnet publish \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output publish-smoke \
            src/Cynthia.Card/src/Cynthia.Card.Server/Cynthia.Card.Server.csproj
          test -x publish-smoke/Cynthia.Card.Server
          test -f publish-smoke/Cynthia.Card.Server.dll

      - name: Build server runtime image
        run: docker build --target runtime --tag legacygwent-diy-ai:${GITHUB_SHA} src/Cynthia.Card

      - name: Smoke-test runtime image
        run: |
          set -Eeuo pipefail
          network_name="gwent-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mongo_name="gwent-mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server_name="gwent-server-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$server_name" "$mongo_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network_name" >/dev/null
          docker run --detach --name "$mongo_name" --network "$network_name" mongo:4.4.29 --bind_ip_all >/dev/null
          for _ in $(seq 1 30); do
            if docker exec "$mongo_name" mongo --quiet --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 2)'; then
              break
            fi
            sleep 1
          done
          docker exec "$mongo_name" mongo --quiet --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 2)'
          docker run --detach --name "$server_name" \
            --network "$network_name" \
            --publish 127.0.0.1::5010 \
            --env ASPNETCORE_URLS=http://0.0.0.0:5010 \
            --env "MONGO_CONNECTION_STRING=mongodb://$mongo_name:27017/gwent-diy-ai" \
            legacygwent-diy-ai:${GITHUB_SHA} >/dev/null
          host_port="$(docker port "$server_name" 5010/tcp | sed 's/.*://')"
          test -n "$host_port"
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "http://127.0.0.1:$host_port/healthz"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$server_name"
          exit 1

  policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Protect stable DIY resources
        run: |
          test "$(grep -c '5010' deploy/diy-ai/card-diy-ai.env.example)" -ge 1
          test "$(grep -c '28021/gwent-diy-ai' deploy/diy-ai/card-diy-ai.env.example)" -eq 1
          ! grep -R --line-number --fixed-strings '/usr/share/card-diy/publish' deploy/diy-ai
          grep -q '^  productName: DiyGwent AITest$' src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/ProjectSettings/ProjectSettings.asset
          grep -q 'buildName: DiyGwent-AITest-' .github/workflows/unity-build-desktop.yml
          grep -q 'buildName: DiyGwent-AITest-' .github/workflows/unity-build-mobile.yml
          grep -q 'versioning: Custom' .github/workflows/unity-build-desktop.yml
          grep -q 'versioning: Custom' .github/workflows/unity-build-mobile.yml
          grep -q 'versioning: Custom' .github/workflows/release.yml
          grep -q 'name: Validate release identity' .github/workflows/release.yml
          grep -q 'test "$REQUESTED_RELEASE_TAG" = "v$client_version"' .github/workflows/release.yml
          grep -q 'test "$tag_commit" = "$workflow_commit"' .github/workflows/release.yml
          grep -q 'group: tagged-release-' .github/workflows/release.yml
          grep -q 'gh release create.*--draft' .github/workflows/release.yml
          grep -q 'gh release upload.*--clobber' .github/workflows/release.yml
          grep -q 'gh release edit.*--draft=false' .github/workflows/release.yml
          ! grep -Eq 'actions/(create-release|upload-release-asset)' .github/workflows/release.yml
          for workflow in .github/workflows/unity-build-desktop.yml .github/workflows/unity-build-mobile.yml .github/workflows/release.yml; do
            grep -Fq 'UNITY_LICENSE: $''{{ secrets.UNITY_LICENSE }}' "$workflow"
            ! grep -q '<?xml' "$workflow"
          done
          grep -q 'package_name="DiyGwent-AITest-Android-\$EXPECTED_CLIENT_VERSION.apk"' .github/workflows/unity-build-mobile.yml
          grep -q 'string clientVersion = PlayerSettings.bundleVersion;' src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Editor/BuildVersionWriter.cs
          grep -q 'private string CurrentVersion => Application.version;' src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Script/LoginScript/GameInit.cs
          ! grep -q '^[[:space:]]*hubConnection.StartAsync();' src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Code/GwentClientService.cs
          grep -q 'public async Task EnsureConnectedAsync(CancellationToken cancellationToken' src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Code/GwentClientService.cs
          grep -q 'AutoUpdateGame(LatestVersionText, cancellationToken)' src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Script/LoginScript/GameInit.cs
          grep -q '^[[:space:]]*- StandaloneLinux64' .github/workflows/unity-build-desktop.yml
          grep -q 'name: Package desktop client' .github/workflows/unity-build-desktop.yml
          grep -q '<TargetFramework>net10.0</TargetFramework>' src/Cynthia.Card/src/Cynthia.Card.Server/Cynthia.Card.Server.csproj
          grep -q 'PackageReference Include="MongoDB.Driver" Version="3.9.0"' src/Cynthia.Card/src/Cynthia.Card.Server/Cynthia.Card.Server.csproj
          grep -q 'PackageReference Include="NLog.Web.AspNetCore" Version="4.9.3"' src/Cynthia.Card/src/Cynthia.Card.Server/Cynthia.Card.Server.csproj
          grep -q 'name: Reject known vulnerable packages' .github/workflows/diy-ai-ci.yml
          sed '/^  policy:/,$d' .github/workflows/diy-ai-ci.yml | grep -q '^      - name: Run server compatibility tests$'
          sed '/^  policy:/,$d' .github/workflows/diy-ai-ci.yml | grep -q '^          src/Cynthia.Card/test/Cynthia.Card.Server.Tests/Cynthia.Card.Server.Tests.csproj$'
          ! grep -q 'PackageReference Include="System.Text.Json"' src/Cynthia.Card/src/Cynthia.Card.Server/Cynthia.Card.Server.csproj
          grep -q '^FROM mcr.microsoft.com/dotnet/sdk:10.0 AS build$' src/Cynthia.Card/Dockerfile
          grep -q '^FROM mcr.microsoft.com/dotnet/runtime-deps:10.0 AS runtime$' src/Cynthia.Card/Dockerfile
          grep -q '^DOTNET_SYSTEM_GLOBALIZATION_PREDEFINED_CULTURES_ONLY=0$' deploy/diy-ai/card-diy-ai.env.example
          grep -q '^ENV DOTNET_SYSTEM_GLOBALIZATION_PREDEFINED_CULTURES_ONLY=0$' src/Cynthia.Card/Dockerfile
          grep -q -- '--self-contained true' .github/workflows/diy-ai-deploy.yml
          grep -q '^[[:space:]]*workflow_call:' .github/workflows/diy-ai-deploy.yml
          ! grep -q '^[[:space:]]*push:' .github/workflows/diy-ai-deploy.yml
          grep -q 'needs: \[server, policy\]' .github/workflows/diy-ai-ci.yml
          grep -q '^ExecStart=.*/usr/local/sbin/run-card-diy-ai$' deploy/diy-ai/card-diy-ai.service
          ! grep -q '/usr/bin/dotnet' deploy/diy-ai/card-diy-ai.service
          grep -q 'exec "$self_contained_host"' deploy/diy-ai/run-server.sh
          echo 'd94c7b887c1ba5e74dd8028e370021c3314dbf2e0179cf33a1452c9f4c1c17c4  src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Assemblies/Microsoft.AspNetCore.SignalR.Client.dll' | sha256sum --check --strict

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diy-ai'
    needs: [server, policy]
    uses: ./.github/workflows/diy-ai-deploy.yml
    secrets: inherit
