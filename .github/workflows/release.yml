name: tagged-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching ProjectSettings.bundleVersion (for example v2.1.9)
        required: true
        type: string

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

permissions:
  contents: read

concurrency:
  group: tagged-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release identity
    runs-on: ubuntu-22.04
    outputs:
      client_version: ${{ steps.release_identity.outputs.client_version }}
      android_version_code: ${{ steps.release_identity.outputs.android_version_code }}
      release_tag: ${{ steps.release_identity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match release tag to Unity client version
        id: release_identity
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          settings="src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/ProjectSettings/ProjectSettings.asset"
          mapfile -t client_versions < <(sed -n 's/^[[:space:]]*bundleVersion:[[:space:]]*//p' "$settings" | tr -d '\r')
          mapfile -t tracked_android_codes < <(sed -n 's/^[[:space:]]*AndroidBundleVersionCode:[[:space:]]*//p' "$settings" | tr -d '\r')
          test "${#client_versions[@]}" -eq 1
          test "${#tracked_android_codes[@]}" -eq 1
          client_version="${client_versions[0]}"
          tracked_android_code="${tracked_android_codes[0]}"
          [[ "$client_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tracked_android_code" =~ ^[0-9]+$ ]]
          IFS=. read -r major minor patch <<< "$client_version"
          for component in "$major" "$minor" "$patch"; do
            test "$((10#$component))" -le 999
          done
          android_version_code="$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))"
          test "$android_version_code" -gt 0
          test "$android_version_code" -lt 2050000000
          test "$tracked_android_code" = "$android_version_code"
          test "$REQUESTED_RELEASE_TAG" = "v$client_version"
          git fetch --force --tags origin
          tag_commit="$(git rev-list -n 1 "$REQUESTED_RELEASE_TAG")"
          workflow_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$tag_commit" = "$workflow_commit"
          echo "client_version=$client_version" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
          echo "release_tag=$REQUESTED_RELEASE_TAG" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create draft release
    needs: validate_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create hidden draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if release_is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$release_is_draft" = "true"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Release $RELEASE_TAG"
          fi

  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    needs:
      - validate_release
      - create_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          - StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          - StandaloneLinux64 # Build a Linux 64-bit standalone.
          - Android # Build an Android .apk standalone app.
          - iOS # Build an iOS player.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/cache@v4
        with:
          path: src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build shared Unity model
        run: dotnet build src/Cynthia.Card/src/Cynthia.Card.Common/Cynthia.Card.Common.csproj
      - name: Sync Cynthia.Card.Common.dll
        run: cp src/Cynthia.Card/src/Cynthia.Card.Common/bin/Debug/netstandard2.0/Cynthia.Card.Common.dll src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/Assets/Assemblies/Cynthia.Card.Common.dll
      - name: Read Unity client version
        id: client_version
        shell: bash
        env:
          EXPECTED_CLIENT_VERSION: ${{ needs.validate_release.outputs.client_version }}
          EXPECTED_ANDROID_VERSION_CODE: ${{ needs.validate_release.outputs.android_version_code }}
        run: |
          set -Eeuo pipefail
          settings="src/Cynthia.Card.Unity/src/Cynthia.Unity.Card/ProjectSettings/ProjectSettings.asset"
          mapfile -t client_versions < <(sed -n 's/^[[:space:]]*bundleVersion:[[:space:]]*//p' "$settings" | tr -d '\r')
          mapfile -t tracked_android_codes < <(sed -n 's/^[[:space:]]*AndroidBundleVersionCode:[[:space:]]*//p' "$settings" | tr -d '\r')
          test "${#client_versions[@]}" -eq 1
          test "${#tracked_android_codes[@]}" -eq 1
          client_version="${client_versions[0]}"
          tracked_android_code="${tracked_android_codes[0]}"
          [[ "$client_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$tracked_android_code" =~ ^[0-9]+$ ]]
          IFS=. read -r major minor patch <<< "$client_version"
          for component in "$major" "$minor" "$patch"; do
            test "$((10#$component))" -le 999
          done
          android_version_code="$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))"
          test "$android_version_code" -gt 0
          test "$android_version_code" -lt 2050000000
          test "$tracked_android_code" = "$android_version_code"
          test "$client_version" = "$EXPECTED_CLIENT_VERSION"
          test "$android_version_code" = "$EXPECTED_ANDROID_VERSION_CODE"
          echo "value=$client_version" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
      - uses: game-ci/unity-builder@7afabe74da5227a9ecd537f5260b398258c3eb3b
        id: unity_build
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: src/Cynthia.Card.Unity/src/Cynthia.Unity.Card
          buildName: DiyGwent-AITest-${{ matrix.targetPlatform }}
          versioning: Custom
          version: ${{ steps.client_version.outputs.value }}
          androidVersionCode: ${{ steps.client_version.outputs.android_version_code }}
          androidExportType: androidPackage
          allowDirtyBuild: true
      - name: Package release client
        id: package
        shell: bash
        env:
          EXPECTED_CLIENT_VERSION: ${{ steps.client_version.outputs.value }}
          EXPECTED_ANDROID_VERSION_CODE: ${{ steps.client_version.outputs.android_version_code }}
          EXPECTED_ANDROID_PACKAGE: cynthia.diy.ai.card
          EXPECTED_ANDROID_LABEL: DiyGwent AITest
          TARGET_PLATFORM: ${{ matrix.targetPlatform }}
        run: |
          set -Eeuo pipefail
          version_file="build/$TARGET_PLATFORM/version.txt"
          test -s "$version_file"
          test "$(tr -d '\r\n' < "$version_file")" = "$EXPECTED_CLIENT_VERSION"
          case "$TARGET_PLATFORM" in
            Android)
              mapfile -t apk_files < <(find "build/$TARGET_PLATFORM" -type f -iname '*.apk' | sort)
              test "${#apk_files[@]}" -eq 1
              asset_name="DiyGwent-AITest-Android-$EXPECTED_CLIENT_VERSION.apk"
              asset_path="$GITHUB_WORKSPACE/$asset_name"
              cp "${apk_files[0]}" "$asset_path"

              find_android_tool() {
                local tool_name="$1"
                local tool_path
                tool_path="$(command -v "$tool_name" || true)"
                if [[ -z "$tool_path" ]]; then
                  local sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
                  test -n "$sdk_root"
                  tool_path="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name "$tool_name" -perm -u+x -print | sort -V | tail -n 1)"
                fi
                test -x "$tool_path"
                printf '%s\n' "$tool_path"
              }

              aapt_path="$(find_android_tool aapt)"
              apksigner_path="$(find_android_tool apksigner)"
              badging_report="$RUNNER_TEMP/aitest-release-android-badging.txt"
              manifest_report="$RUNNER_TEMP/aitest-release-android-manifest.txt"
              signature_report="$RUNNER_TEMP/aitest-release-android-signature.txt"

              "$aapt_path" dump badging "$asset_path" > "$badging_report"
              package_line="$(grep -m 1 '^package:' "$badging_report")"
              [[ "$package_line" == *"name='$EXPECTED_ANDROID_PACKAGE'"* ]]
              [[ "$package_line" == *"versionCode='$EXPECTED_ANDROID_VERSION_CODE'"* ]]
              [[ "$package_line" == *"versionName='$EXPECTED_CLIENT_VERSION'"* ]]
              grep -Fq "application-label:'$EXPECTED_ANDROID_LABEL'" "$badging_report"
              grep -Fq "uses-permission: name='android.permission.INTERNET'" "$badging_report"

              "$aapt_path" dump xmltree "$asset_path" AndroidManifest.xml > "$manifest_report"
              grep -Eq 'android:usesCleartextTraffic.*(0xffffffff|true)' "$manifest_report"

              "$apksigner_path" verify --verbose --print-certs "$asset_path" > "$signature_report"
              grep -Fq 'Verifies' "$signature_report"
              grep -Eq '^Number of signers: [1-9][0-9]*$' "$signature_report"
              grep -Eq '^Signer (#[0-9]+|\([^)]*\)) certificate DN:' "$signature_report"
              grep -Eq '^Signer (#[0-9]+|\([^)]*\)) certificate SHA-256 digest: [0-9a-fA-F]{64}$' "$signature_report"
              echo 'Signing certificate (audit only; no stable identity is asserted):'
              grep -E '^Signer (#[0-9]+|\([^)]*\)) certificate (DN|SHA-256 digest):' "$signature_report"
              ;;
            StandaloneWindows64) asset_name="DiyGwent-AITest-Windows-$EXPECTED_CLIENT_VERSION.zip" ;;
            StandaloneOSX) asset_name="DiyGwent-AITest-macOS-$EXPECTED_CLIENT_VERSION.zip" ;;
            StandaloneLinux64) asset_name="DiyGwent-AITest-Linux-$EXPECTED_CLIENT_VERSION.zip" ;;
            iOS) asset_name="DiyGwent-AITest-iOS-$EXPECTED_CLIENT_VERSION.zip" ;;
            *) echo "Unsupported release target: $TARGET_PLATFORM" >&2; exit 1 ;;
          esac
          if [[ "$TARGET_PLATFORM" != Android ]]; then
            package_root="${asset_name%.zip}"
            staging_dir="$RUNNER_TEMP/release-$TARGET_PLATFORM"
            mkdir -p "$staging_dir/$package_root"
            cp -a --no-preserve=ownership "build/$TARGET_PLATFORM/." "$staging_dir/$package_root/"
            asset_path="$GITHUB_WORKSPACE/$asset_name"
            (
              cd "$staging_dir"
              zip -qry -y "$asset_path" "$package_root"
            )
          fi
          test -s "$asset_path"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
      - name: Upload asset to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          gh release upload "$RELEASE_TAG" "$ASSET_PATH" --repo "$GITHUB_REPOSITORY" --clobber

  publish_release:
    name: Publish complete release
    needs:
      - validate_release
      - buildForAllSupportedPlatforms
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
